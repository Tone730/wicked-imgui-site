<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email — Wicked Imgui</title>
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="./"><img src="assets/logo-mark.svg" alt="">Wicked Imgui</a>
      <div class="quote">
        <h2>One last step.</h2>
        <p>Confirming your email keeps account recovery and license notices working.</p>
      </div>
    </aside>

    <main class="auth-main">
      <div class="top">
        <span>Have an account?</span>
        <a class="btn sm" href="login.html">Log in</a>
      </div>

      <div class="auth-form">
        <h1 id="confirm-title">Confirming…</h1>
        <p id="confirm-lead">One moment while we check your link.</p>

        <div id="confirm-status" hidden style="margin-top:20px"></div>

        <form id="reset-form" class="form" novalidate hidden style="margin-top:20px">
          <div class="form-error" role="alert"><svg class="icon"><use href="assets/icons.svg#info"/></svg><span></span></div>
          <div class="field">
            <label for="new-password">New password</label>
            <div class="pw">
              <input class="input" id="new-password" name="password" type="password" autocomplete="new-password" placeholder="At least 10 characters" required>
              <button type="button" aria-label="Show password"><svg class="icon"><use href="assets/icons.svg#eye"/></svg></button>
            </div>
          </div>
          <button class="btn primary block" type="submit">Set new password</button>
        </form>

        <p style="margin-top:20px"><a class="link" href="login.html">← Back to log in</a></p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap">© <span data-year>2026</span> Wicked Imgui · <a href="privacy.html#terms">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="faq.html">Help</a></div>
  </footer>

  <script type="module" src="js/confirm.js"></script>
</body>
</html>
